<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Heart</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: black;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        const width = window.innerWidth;
        const height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        const centerX = width / 2;
        const centerY = height / 2;

        ctx.fillStyle = "#ffb6c1";
        ctx.font = "bold 9px Arial";
        ctx.textAlign = "center";

        let currentScale = 11;
        const maxScale = 16;
        let currentI = 0;
        const totalI = 120;

        function animate() {
            if (currentScale > maxScale) return;

            let t = currentI * (2 * Math.PI) / totalI;

            // معادلة رسم القلب
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

            let posX = centerX + (x * currentScale);
            let posY = centerY + (y * currentScale);

            // كتابة الجملة
            ctx.fillText("I love you", posX, posY);

            currentI++;

            if (currentI >= totalI) {
                currentI = 0;
                currentScale++;
            }

            // تأخير ملليمترات بسيطة (30ms) بين كل كلمة والتانية عشان تبان أبطأ ورائعة
            setTimeout(animate, 15);
        }

        // بدء الرسم
        animate();
    </script>
</body>
</html>
